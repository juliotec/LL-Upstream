# The launcher's releases (docs/releases.md; how to make one: RELEASING.md). The same workflow as MagicBeanDev/Longshot's,
# but for what is built: here the launcher itself, released apart from Longshot, on its own three channels.
#
#   a push to main       the nightly: nightly-<commits on main>-<commit>, a pre-release, 5 minutes after the last of a few
#                        merges in a row (and at least once an hour while they keep coming)
#                        and none when the commits since the nightly before put nothing on its page (ci:, chore:)
#   a tag vX.Y.Z         a stable (the stable channel). The launcher's first is v1.0.0
#
# 1. version: the version's name; a tag is checked first (Tooling's scripts/release.py check-tag: its form, on main, above every
#    release, and as high as the commits since the last stable call for). A refused tag builds nothing.
# 2. build: LongshotLauncher-<v>-windows-x64-setup.exe (the program, which offers to install itself), LongshotLauncher-<v>-
#    windows-x64-portable.zip (the same program and its "portable" file) and LongshotLauncher-<v>-x86_64.AppImage
#    (scripts/package.sh, on Linux). Each program is started with --self-check before it is kept: the AppImage's by package.sh,
#    the Windows program's under Wine (there is no Windows runner): a build of it that unpacks itself to disk, since Wine cannot
#    load the shipped one, which .NET maps from the uncompressed file. Whether the shipped file starts is a Windows tester's.
# 3. publish: SHA256SUMS over them, SHA256SUMS.sig (the release key), the notes (git-cliff, cliff.toml), then a draft
#    release with every file, published last: until then no launcher sees it. A nightly also prunes the nightlies past the
#    newest 5. Nothing is committed back to the repository.
#
# The release is made with the job's own token (forgejo.token, passed to Tooling's scripts/release.py as RELEASE_TOKEN): no bot account,
# no token secret. Only the publish job may write (contents: write: this repository's releases and tags); the others read.
# Secret (RELEASING.md, One-time setup; an organization secret, shared with Longshot): RELEASE_SIGNING_KEY_SEALED (the
# release key's private PEM, sealed with Longshot's scripts/ci_secret.sh). version and publish run on the runner kept for
# them (runs-on: deploy); publish gets the seal.key that opens it from the seal broker, for a run of main or a v* tag only
# (enable-openid-connect, SEAL_BROKER_PIN; Longshot's docs/dev/reference/ci.md, Secrets only our runners can open). Variable: RELEASE_UPLOAD_API (passed to release.py as FORGEJO_UPLOAD_API; Forgejo reserves the FORGEJO_ prefix for variables), the API's address without Cloudflare in front, when a file is larger than its
# 100 MB upload limit.
# release.py is Tooling's (MagicBeanDev/Tooling, scripts/release.py), cloned at the commit .tooling-rev names: a change to the
# release is a Tooling pull request, then a pull request here that moves .tooling-rev to it.
name: Release
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  version:
    name: The version
    runs-on: deploy  # (only the runner kept for deploys and releases: the version and commit it names are what is built and signed)
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      ref: ${{ steps.name.outputs.ref }}
    steps:
      - name: Check out the commit, with its history
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # (the one commit, not Tooling's history)
      - name: Tooling's release.py, at the commit .tooling-rev names
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/tooling"
          git -C "$RUNNER_TEMP/tooling" fetch -q --depth 1 https://git.magicbean.dev/MagicBeanDev/Tooling.git "$(cat .tooling-rev)"
          git -C "$RUNNER_TEMP/tooling" checkout -q FETCH_HEAD
          echo "RELEASE_PY=$RUNNER_TEMP/tooling/scripts/release.py" >> "$GITHUB_ENV"
      - name: The version's name (a tag checked, or the nightly's)
        id: name
        env:
          RELEASE_TOKEN: ${{ forgejo.token }}
        run: |
          git fetch -q --tags origin main
          ref=$(git rev-parse HEAD)
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            python3 -I "$RELEASE_PY" check-tag "$tag" --main origin/main
          else
            # (merges in a row build one nightly: the release runs queue one at a time, and a nightly whose commit is still
            # main's waits 5 minutes for more. One whose commit is no longer main's, then or before, skips: the newer one
            # builds. Unless the newest nightly is an hour old: while merges keep coming, a nightly still comes out each hour.
            # The wait is on the quick runner, which has room for it (MagicBeanDev/Infra, runner/quick/config.yml))
            if [[ $GITHUB_EVENT_NAME == push ]]; then
              if [[ $(git rev-parse origin/main) == "$ref" ]]; then
                echo "waiting 5 minutes for more merges: merges in a row build one nightly, the newest"
                sleep 300
                git fetch -q origin main
              fi
              head=$(git rev-parse origin/main)
              if [[ $head != "$ref" ]]; then
                age=$(python3 -I "$RELEASE_PY" nightly-age) || age=none   # (no answer: it builds)
                if [[ $age != none ]] && (( age < 3600 )); then
                  echo "::notice::main has moved on to ${head:0:8}: this nightly skips, the newer one builds"
                  echo "tag=" >> "$GITHUB_OUTPUT"
                  echo "ref=$ref" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::notice::main has moved on to ${head:0:8}, but the newest nightly is an hour old (${age}s): this one builds"
              fi
            fi
            # (a nightly whose page would list nothing new since the nightly before, only ci: or chore: commits, is not
            # made: the next one comes with what follows. git-cliff decides, as for the notes; no answer: it builds)
            if [[ $GITHUB_EVENT_NAME == push ]]; then
              news=yes
              if cliff=$(python3 -I "$RELEASE_PY" git-cliff "$RUNNER_TEMP/cliff"); then
                news=$(GIT_CLIFF=$cliff python3 -I "$RELEASE_PY" nightly-news) || news=yes
              fi
              if [[ $news == no ]]; then
                echo "::notice::nothing for the notes since the newest nightly (ci: or chore: commits only): no nightly"
                echo "tag=" >> "$GITHUB_OUTPUT"
                echo "ref=$ref" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            tag=$(python3 -I "$RELEASE_PY" nightly-name)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "$tag, from $ref"

  build:
    name: The launcher, both systems
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: release  # (a release's build: only the runners kept for them take it, Longshot's docs/forgejo-runners.md)
    timeout-minutes: 45
    steps:
      - name: Check out the version's commit
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      # (Wine for the check below, about 20 s of apt, installed in the background while package.sh builds; the check waits
      # for it. Detached (setsid, every descriptor elsewhere), so this step ends at once; its status is written last, by mv)
      - name: Wine (installed in the background)
        run: |
          sudo=; [[ $(id -u) == 0 ]] || sudo=sudo
          # shellcheck disable=SC2016   # (the inner script's $0 and $1 are its own arguments, expanded there)
          DEBIAN_FRONTEND=noninteractive setsid nohup bash -c '$0 dpkg --add-architecture i386 || true
            $0 apt-get update -qq && $0 apt-get install -y -qq --no-install-recommends wine wine64
            echo $? > "$1.tmp" && mv "$1.tmp" "$1.status"' "${sudo:-env}" "$RUNNER_TEMP/wine-apt" \
            > "$RUNNER_TEMP/wine-apt.log" 2>&1 < /dev/null &
      # (the release's own cache, of downloads only, each checked by its hash every time it is used, so a cache can cost
      # a download, never change what is built: the .NET SDK's archive (Microsoft's SHA-512, scripts/ci_dotnet.sh) and
      # package.sh's appimagetool and runtime (their SHA-256). Restored and saved only by a run of main or a v* tag, on the
      # release runner; nothing unpacked or compiled is kept, and NuGet's packages are not cached here (docs/ci.md, The
      # release's cache))
      - name: Restore the release's downloads
        id: downloads
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dotnet-download
            .appimagetool
          key: release-downloads-${{ hashFiles('global.json', 'scripts/ci_dotnet.sh', 'scripts/package.sh') }}
      - name: The .NET SDK (global.json's)
        run: scripts/ci_dotnet.sh "$RUNNER_TEMP/dotnet-download" "$RUNNER_TEMP/dotnet"
      - name: The Windows setup, the portable zip and the AppImage
        env:
          WINE_CHECK_EXE: ${{ runner.temp }}/wine-check/LongshotLauncher.exe
        run: scripts/package.sh "${{ needs.version.outputs.tag }}" dist
      # (the same code built to unpack itself to disk: Wine cannot load the shipped program, whose code .NET maps from the
      # uncompressed file, "Incorrect alignment (0x8007046C)". The shipped file is not started here: RELEASING.md)
      - name: The Windows program starts (--self-check, under Wine)
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # (the background install: its status, and its log when it failed; one that never ends stops here in 10 minutes)
          echo "waiting for Wine's background install to end (at most 10 minutes)"
          for _ in $(seq 600); do [[ -f $RUNNER_TEMP/wine-apt.status ]] && break; sleep 1; done
          status=$(cat "$RUNNER_TEMP/wine-apt.status" 2>/dev/null || echo "no end in 10 minutes")
          [[ $status == 0 ]] || { cat "$RUNNER_TEMP/wine-apt.log"; echo "::error::Wine's install failed ($status)"; exit 1; }
          wine=$(command -v wine64 || command -v wine)
          export WINEDEBUG=-all WINEPREFIX="$RUNNER_TEMP/wine"
          "$wine" wineboot --init >/dev/null 2>&1 || true
          out=$("$wine" "$RUNNER_TEMP/wine-check/LongshotLauncher.exe" --self-check | tr -d '\r')
          echo "$out"
          grep -qxF "LongshotLauncher $TAG" <<<"$out" || { echo "::error::the Windows launcher does not answer --self-check with $TAG"; exit 1; }
      - name: Save the release's downloads
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.downloads.outputs.cache-hit != 'true' }}
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dotnet-download
            .appimagetool
          key: release-downloads-${{ hashFiles('global.json', 'scripts/ci_dotnet.sh', 'scripts/package.sh') }}
      # (the files through the server's own address first, RELEASE_UPLOAD_API's host on this runner's network, as
      # Longshot's build-linux.yml does: upload-artifact talks to ACTIONS_RESULTS_URL, given here per step, and nothing is
      # recompressed (compression-level 0: the zip and the AppImage are compressed already, and on the server's own
      # network the setup's 106 MB cost less sent as they are than deflated on the runner's 2 cores). When that fails,
      # or the variable is unset, by the public address behind Cloudflare, compressed: a request there can fail once,
      # and the action does not send a block again (2026-11-13, the launcher's nightly: one 8 MB block, "SSL alert bad
      # record mac"), so it is sent once more when it failed: Forgejo takes the same name again)
      - name: The server's own address, for the upload
        id: direct
        env:
          UPLOAD_API: ${{ vars.RELEASE_UPLOAD_API }}
        run: |
          if [[ $UPLOAD_API == http*://*/api/v1* ]]; then
            echo "url=${UPLOAD_API%%/api/v1*}/" >> "$GITHUB_OUTPUT"
            echo "the upload goes through ${UPLOAD_API%%/api/v1*}"
          else
            echo "::notice::no RELEASE_UPLOAD_API: the upload goes through the public address"
          fi
      - name: Upload LongshotLauncher, through the server's own address
        id: upload_direct
        if: steps.direct.outputs.url != ''
        continue-on-error: true
        env:
          ACTIONS_RESULTS_URL: ${{ steps.direct.outputs.url }}
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: LongshotLauncher
          path: dist/LongshotLauncher-*
          if-no-files-found: error
          compression-level: 0
      - name: Upload LongshotLauncher
        id: upload_1
        if: steps.direct.outputs.url == '' || steps.upload_direct.outcome == 'failure'
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: LongshotLauncher
          path: dist/LongshotLauncher-*
          if-no-files-found: error
      - name: Upload LongshotLauncher (again, the first try having failed)
        if: steps.upload_1.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: LongshotLauncher
          path: dist/LongshotLauncher-*
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: deploy  # (the runner kept for deploys and releases, on the seal broker's network)
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    enable-openid-connect: true   # (the ID token the seal broker checks: this job only)
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SEAL_BROKER_PIN: ${{ vars.SEAL_BROKER_PIN }}
      TAG: ${{ needs.version.outputs.tag }}
      REF: ${{ needs.version.outputs.ref }}
      RELEASE_TOKEN: ${{ forgejo.token }}
      FORGEJO_UPLOAD_API: ${{ vars.RELEASE_UPLOAD_API }}
    steps:
      - name: Check out the version's commit, with its history
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tooling's release.py, at the commit .tooling-rev names
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/tooling"
          git -C "$RUNNER_TEMP/tooling" fetch -q --depth 1 https://git.magicbean.dev/MagicBeanDev/Tooling.git "$(cat .tooling-rev)"
          git -C "$RUNNER_TEMP/tooling" checkout -q FETCH_HEAD
          echo "RELEASE_PY=$RUNNER_TEMP/tooling/scripts/release.py" >> "$GITHUB_ENV"
      # (the launchers from Forgejo's own address, RELEASE_UPLOAD_API on this runner's network, where the artifacts are on
      # its disk: through its public address behind Cloudflare, as download-artifact fetches them, they came at about
      # 2 MB/s, 79 s of this job's 127 (nightly-100). When that fails (no variable, an API that answers otherwise), the
      # download-artifact steps below fetch them as before)
      - name: The launchers, from Forgejo's own address
        id: artifacts
        continue-on-error: true
        run: python3 -I "$RELEASE_PY" artifacts files --run "$GITHUB_RUN_ID" LongshotLauncher
      # (from Forgejo's public address behind Cloudflare, as the build jobs' upload: fetched once more when it failed)
      - name: The launchers, from the public address
        id: download_2
        if: steps.artifacts.outcome == 'failure'
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: LongshotLauncher
          path: files
      - name: The launchers, from the public address (again, the first try having failed)
        if: steps.artifacts.outcome == 'failure' && steps.download_2.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: LongshotLauncher
          path: files
      - name: The files
        run: |
          git fetch -q --tags origin
          ls -l files
          test -f "files/LongshotLauncher-$TAG-windows-x64-setup.exe" && test -f "files/LongshotLauncher-$TAG-windows-x64-portable.zip" \
            && test -f "files/LongshotLauncher-$TAG-x86_64.AppImage"
      - name: seal.key, from the seal broker (a run of main or a v* tag only)
        run: |
          umask 077
          case $ACTIONS_ID_TOKEN_REQUEST_URL in *\?*) sep='&' ;; *) sep='?' ;; esac
          idt=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=magicbean-seal-broker" | jq -r '.value // empty')
          [[ -n $idt ]] || { echo "::error::no ID token: this job needs enable-openid-connect: true"; exit 1; }
          # (-k with the key pinned: the broker's certificate is self-signed, and only its key is accepted. A refusal says
          # why: the broker hands seal.key to runs of main and v* tags only; MagicBeanDev/Infra's README, The seal broker)
          if ! curl -sS -k --pinnedpubkey "sha256//$SEAL_BROKER_PIN" --fail-with-body -X POST \
              -H "Authorization: Bearer $idt" -o "$RUNNER_TEMP/seal.key" https://magicbean-seal-broker:8443/seal-key; then
            echo "::error::the seal broker gave no key ($(head -c 300 "$RUNNER_TEMP/seal.key" 2>/dev/null))"
            rm -f "$RUNNER_TEMP/seal.key"
            exit 1
          fi
          echo "SEAL_KEY=$RUNNER_TEMP/seal.key" >> "$GITHUB_ENV"
      - name: SHA256SUMS, signed
        env:
          SEALED: ${{ secrets.RELEASE_SIGNING_KEY_SEALED }}
        run: |
          [[ -n $SEALED ]] || { echo "::error::no RELEASE_SIGNING_KEY_SEALED secret (RELEASING.md, One-time setup)"; exit 1; }
          [[ -r ${SEAL_KEY:-} ]] || { echo "::error::no seal.key: the step before fetches it from the seal broker"; exit 1; }
          python3 -I "$RELEASE_PY" sums files/* --out files/SHA256SUMS
          umask 077
          # (the key is sealed: only the seal broker's seal.key opens it; the same as Longshot's scripts/ci_secret.sh unseal)
          printf '%s\n' "$SEALED" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -a -A -pass "file:$SEAL_KEY" > "$RUNNER_TEMP/key.pem"
          python3 -I "$RELEASE_PY" sign files/SHA256SUMS --key "$RUNNER_TEMP/key.pem" --out files/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/key.pem"
          # (checked with the key this launcher is built with, not the one just used: a key it does not trust stops here)
          python3 -I "$RELEASE_PY" verify files/SHA256SUMS --files files
          cat files/SHA256SUMS
      - name: The notes
        run: |
          GIT_CLIFF=$(python3 -I "$RELEASE_PY" git-cliff "$RUNNER_TEMP/cliff")
          export GIT_CLIFF
          python3 -I "$RELEASE_PY" notes "$TAG" --out notes.md
          cat notes.md
      - name: Publish
        run: python3 -I "$RELEASE_PY" publish "$TAG" --target "$REF" --notes notes.md files/*
      - name: Prune the nightlies
        if: startsWith(needs.version.outputs.tag, 'nightly-')
        run: python3 -I "$RELEASE_PY" prune --keep 5
