# A pull request's title (docs/ci.md, Forgejo Actions): a squash-merged pull request's title is its commit on main, a line
# of the next release's notes, and what decides the next version, so it must be a Conventional Commit, by Tooling's
# scripts/release.py's TITLE at main's .tooling-rev (a pull request cannot loosen the rule for itself; only while main has
# no .tooling-rev is it read from the pull request). The title is read from the event, never put in the shell's text.
# (Here, not in ci.yml, as on MagicBeanDev/Longshot: this file also runs when a title is edited, and an edit's run of
# ci.yml would cancel and replace the code's checks.) No code of the pull request's runs; no game data is involved.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

# (an edit or a push makes a new run; an older one still running for the same pull request is cancelled)
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional Commit title
    runs-on: quick  # (a quick job: the runner kept free for these takes it, or any runner with room)
    timeout-minutes: 5
    steps:
      - name: Check out main's .tooling-rev
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .tooling-rev
      - name: Check out the pull request's .tooling-rev (main has none yet)
        if: hashFiles('.tooling-rev') == ''
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: .tooling-rev
      - name: Tooling's release.py, at the commit .tooling-rev names
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/tooling"
          git -C "$RUNNER_TEMP/tooling" fetch -q --depth 1 https://git.magicbean.dev/MagicBeanDev/Tooling.git "$(cat .tooling-rev)"
          git -C "$RUNNER_TEMP/tooling" checkout -q FETCH_HEAD
      - name: The title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 -I - <<'PY'
          import importlib.util, os, sys
          spec = importlib.util.spec_from_file_location("release", os.path.join(os.environ["RUNNER_TEMP"], "tooling", "scripts", "release.py"))
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          title = os.environ["TITLE"]
          if title.startswith("WIP: "):
              title = title[5:]
          if not release.TITLE.match(title) or len(title.split(": ", 1)[-1].strip()) == 0:
              print("::error::the title must be a Conventional Commit, type(scope): description (CONTRIBUTING.md): %r" % title)
              sys.exit(1)
          print("ok: %s" % title)
          PY
