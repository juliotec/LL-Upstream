# Rust launcher checks, release packaging and a game-free upgrade from the previous stable.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # (whether build-test and package are needed: on a pull request, not when it changes only the docs, and package only
  # when a packaging file changes (scripts/ci_changes.py, the base's, so a pull request can't skip its own checks; a base
  # from before the script runs everything). A push or a run by hand runs everything. A job not needed shows as skipped,
  # which Forgejo and forge.py count as passed)
  changes:
    name: What the change needs
    runs-on: quick  # (a quick job: the runner kept free for these takes it, or any runner with room)
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code || 'true' }}
      package: ${{ steps.files.outputs.package || 'true' }}
    steps:
      - name: Check out the base's scripts (in base/)
        if: github.event_name == 'pull_request'
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: scripts
      - name: The pull request's files, by the base's script
        id: files
        if: github.event_name == 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f base/scripts/ci_changes.py ]; then
            python3 -I base/scripts/ci_changes.py --server "${{ github.server_url }}" --repo "${{ github.repository }}" --pr "$PR_NUMBER"
          else
            echo "a base from before scripts/ci_changes.py: every job runs"
            printf 'code=true\npackage=true\n' >> "$GITHUB_OUTPUT"
          fi

  # (`mise run lint`'s checks and the workflows': actionlint (.actionlint.yml), ShellCheck on every script under scripts/,
  # gitleaks on the tree (.gitleaks.toml), and the JSON files parse. Always run: they read the whole tree)
  lint:
    name: Lint (actionlint, ShellCheck, gitleaks)
    runs-on: quick  # (a quick job: the runner kept free for these takes it, or any runner with room)
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # (mise.lock's archives, each checked by its SHA-256 when used: read by every run, written by a push to main when
      # missing)
      - name: Restore the lint tools' downloads
        id: tools-cache
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lint-downloads
          key: lint-tools-${{ hashFiles('mise.lock') }}
      - name: actionlint, ShellCheck and gitleaks (mise.lock's)
        run: scripts/ci_lint_tools.sh "$RUNNER_TEMP/lint-downloads" "$RUNNER_TEMP/lint-bin"
      - name: actionlint (the workflows)
        run: actionlint -color -config-file .actionlint.yml .forgejo/workflows/*.yml
      - name: ShellCheck (scripts/)
        if: ${{ !cancelled() }}
        run: |
          mapfile -d '' files < <(find scripts -type f -name '*.sh' -print0)
          shellcheck -x "${files[@]}"
      - name: gitleaks
        if: ${{ !cancelled() }}
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: The JSON files parse
        if: ${{ !cancelled() }}
        run: |
          mapfile -d '' files < <(git ls-files -z '*.json')
          python3 -I -c 'import json, sys
          for f in sys.argv[1:]:
              json.load(open(f, encoding="utf-8"))
          print("%d JSON files parse" % (len(sys.argv) - 1))' "${files[@]}"
      - name: Save the lint tools' downloads
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tools-cache.outputs.cache-hit != 'true' }}
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lint-downloads
          key: lint-tools-${{ hashFiles('mise.lock') }}

  build-test:
    name: Rust formatting, lint and tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          scripts/ci-rust-toolchain.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add rustfmt clippy
      - name: Restore registry downloads
        id: crates
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/registry
          key: launcher-crates-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Test the launcher against its pinned builder contract
        run: |
          longshot="$RUNNER_TEMP/longshot-contract"
          git init -q "$longshot"
          git -C "$longshot" sparse-checkout set --no-cone \
            /builder/crates/build-driver/src/options.rs /docs/dev/reference/build-events.md \
            /host/nn_applet.c /scripts/fetch.py /scripts/devtools/packs.py
          pin=$(sed -nE '/^[0-9a-f]{40}$/p' tests/longshot.ref)
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          git -C "$longshot" fetch -q --depth 1 --filter=blob:none https://git.magicbean.dev/MagicBeanDev/Longshot.git "$pin"
          git -C "$longshot" checkout -q --detach FETCH_HEAD
          scripts/ci-test.sh --longshot "$longshot"
      - name: Verify the release key and release-tool contract
        run: |
          scripts/ci_tooling.sh "$RUNNER_TEMP/tooling"
          for stable in v1.3.0 v1.3.1; do
            python3 -I "$RUNNER_TEMP/tooling/scripts/release.py" --product launcher verify "tests/fixtures/release/$stable/SHA256SUMS"
          done
          LAUNCHER="$PWD" python3 -I "$RUNNER_TEMP/tooling/tests/test_release.py"
      - name: Cache registry downloads
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.crates.outputs.cache-hit != 'true' }}
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/registry
          key: launcher-crates-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

  package:
    name: Release packages and stable upgrades
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install release tools and the test desktop
        run: |
          scripts/ci-rust-toolchain.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          sudo=; [[ $(id -u) == 0 ]] || sudo=sudo
          $sudo apt-get install -y -qq --no-install-recommends xvfb xauth xdotool fonts-dejavu-core libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6
          scripts/ci-wine.sh
      - name: Package the test release and start its Linux window
        run: |
          scripts/package.sh v2.0.0 dist
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s '-screen 0 1400x900x24' python3 -I tests/test_rust_window.py "$PWD/dist/LongshotLauncher-v2.0.0-linux-x64.AppImage"
      - name: SDK for the stable updater test fixture
        uses: https://github.com/actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'
      - name: Run the v1.3.0/v1.3.1 updater on Linux and Windows
        run: tests/update_handoff/run.sh v2.0.0 dist "$RUNNER_TEMP/handoff"
