# actionlint's settings for the workflows here (ci.yml's lint job, docs/ci.md): it knows GitHub, not Forgejo. The same as
# MagicBeanDev/Longshot's .forgejo/actionlint.yaml.
self-hosted-runner:
  # (docs/ci.md, Forgejo Actions: quick is the label of the short jobs' runner, release of the releases' builds, deploy
  # of the jobs that sign or publish)
  labels: [quick, release, deploy]

paths:
  '.forgejo/workflows/**':
    ignore:
      # (Forgejo takes a full URL in uses:, https://github.com/... or https://data.forgejo.org/...)
      - 'specifying action'
      # (Forgejo's own context, as github)
      - 'undefined variable "forgejo"'
      # (Forgejo's: a job's ID token for the seal broker)
      - 'unexpected key "enable-openid-connect" for "job" section'
