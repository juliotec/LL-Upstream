min_version = "2026.11.3"

[tools]
python = "3.12.16"
"aqua:pre-commit/pre-commit" = "4.0.1"
dotnet = "10.0.404"
"github:koalaman/shellcheck" = "0.10.0"
"github:rhysd/actionlint" = "1.7.12"
"github:open-policy-agent/conftest" = "0.71.1"
gitleaks = "8.30.1"
"github:CircleCI-Public/circleci-cli" = "1.14.0"

[tasks.setup]
description = "Install pre-commit and commit-msg hooks (run once after clone)"
shell = "bash -c"
run = "pre-commit install"

[tasks.lint]
description = "CI lint tier (contributor pre-push)"
shell = "bash -c"
run = """
set -euo pipefail
shellcheck -x scripts/package.sh
gitleaks dir . --config .circleci/gitleaks.toml --redact --no-banner
"""

[tasks.test]
description = "Launcher test harnesses (needs openssl, dotnet)"
shell = "bash -c"
run = """
set -euo pipefail
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null
python -m pip install --disable-pip-version-check --require-hashes -r tests/requirements-pytest.txt
dotnet build LongshotLauncher.slnx --configuration Release -p:RestoreLockedMode=true
python -m pytest tests/test_release.py
"""

[tasks."build:package"]
description = "Local packaging smoke (Linux)"
shell = "bash -c"
run = "scripts/package.sh ci-smoke dist"

[tasks.validate]
description = "Merged event configs (circleci-orb tools/validate.sh when available)"
shell = "bash -c"
run = """
set -euo pipefail
circleci config validate .circleci/config.yml
circleci config validate .circleci/forks.yml
orb_root="${MB_ORB_DIR:-}"
if [ -z "$orb_root" ] || [ ! -x "$orb_root/tools/validate.sh" ]; then
  echo "set MB_ORB_DIR to a local checkout of MagicBeanDev/orb (lean-orb branch)" >&2
  exit 1
fi
bash "$orb_root/tools/validate.sh" "$PWD"
"""

[tasks."ci:smoke"]
description = "Fast pre-push: lint + release script tests"
depends = ["lint", "test"]