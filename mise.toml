min_version = "2026.11.3"

[tools]
python = "3.12.16"
"aqua:pre-commit/pre-commit" = "4.0.1"
"github:koalaman/shellcheck" = "0.10.0"
"github:rhysd/actionlint" = "1.7.12"
gitleaks = "8.30.1"

[tasks.setup]
description = "Install pre-commit and commit-msg hooks (run once after clone)"
shell = "bash -c"
run = "pre-commit install"

[tasks.lint]
description = "CI lint tier (contributor pre-push)"
shell = "bash -c"
run = """
set -euo pipefail
shellcheck -x scripts/*.sh
actionlint -config-file .actionlint.yml .forgejo/workflows/*.yml
gitleaks dir . --config .gitleaks.toml --redact --no-banner
"""

[tasks.test]
description = "Rust formatting, lint, native tests and signed release fixtures"
shell = "bash -c"
run = """
set -euo pipefail
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null
scripts/ci-test.sh
LAUNCHER="$PWD" python -I "${MAGICBEAN_TOOLING:-../Tooling}/tests/test_release.py"
"""

[tasks."build:package"]
description = "Local packaging smoke (Linux)"
shell = "bash -c"
run = "scripts/package.sh ci-smoke dist"

[tasks."ci:smoke"]
description = "Fast pre-push: lint + release script tests"
depends = ["lint", "test"]
