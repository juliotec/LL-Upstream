# API-triggered workflows (release_dry_run, full on main). See docs/ci.md.
workflows:
  manual-dry-run:
    when:
      equal: [true, << pipeline.parameters.release_dry_run >>]
    jobs:
      - lint
      - build-test
      - release-scripts
      - version:
          requires: [lint, build-test, release-scripts]
      - build-release:
          requires: [version]
      - mb/release-sign:
          name: sign
          dry-run: true
          requires: [build-release]
      - mb/release-publish:
          name: publish
          serial-group: << pipeline.project.slug >>/release
          dry-run: true
          requires: [sign]
      - mb/gate:
          name: gate
          requires: [lint, build-test, release-scripts, sign, publish]

  manual-full:
    when:
      and:
        - equal: [true, << pipeline.parameters.full >>]
        - equal: [false, << pipeline.parameters.release_dry_run >>]
    jobs:
      - lint
      - build-test
      - release-scripts
      - package
      - dotnet-format
      - mb/gate:
          name: gate
          requires: [lint, build-test, release-scripts, package]
