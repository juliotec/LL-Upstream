# Scheduled nightly (parameter nightly: true, not a main push): Longshot contract only.
# Main push already publishes nightlies via events/main.yml. See docs/ci.md.
workflows:
  nightly:
    jobs:
      - lint
      - contract-longshot-main
      - mb/gate:
          name: gate
          requires:
            - lint
            - contract-longshot-main
