# Gitleaks rules for the lint job (mise lint / shared.yml). See docs/ci.md.
title = "LongshotLauncher gitleaks"

[extend]
useDefault = true

# tests/fixtures/release/test-key.pem is a PRIVATE key committed on purpose: scripts/release.py signs the fixtures' SHA256SUMS with
# it and the launcher's tests check them. The launcher never trusts it (tests/test_release.py asserts that), and the real key
# exists only as the RELEASE_SIGNING_KEY secret (CONTRIBUTING.md, RELEASING.md).
[[allowlists]]
description = "the committed test signing key"
paths = ['''tests/fixtures/release/test-key\.pem''']
