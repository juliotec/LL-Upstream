# Path areas for circleci/path-filtering (grep -P). Last match wins per parameter key. See docs/ci.md.
# <regex> <parameter> <value>

^App/.* app true
^Core/.* core true
^tests/.* tests true
^tools/.* tests true
^scripts/package\.sh$ packaging true
^App/app\.manifest$ packaging true
^App/Windows.*\.cs$ packaging true
^App/SetupWindows\.cs$ packaging true
^scripts/translations\.py$ core true
^scripts/translations\.py$ tests true
^\.tooling-rev$ release_scripts true
^cliff\.toml$ release_scripts true
^tests/requirements-pytest\.txt$ release_scripts true
^tests/fixtures/release/.* release_scripts true
^Core/ReleaseTrust\.cs$ release_scripts true
^docs/.* docs_only true
^README\.md$ docs_only true
^CONTRIBUTING\.md$ docs_only true
^RELEASING\.md$ docs_only true
^AGENTS\.md$ docs_only true
^LICENSE$ docs_only true
^\.actionlint\.yml$ docs_only true
^\.forgejo/.* docs_only true
^\.circleci/.* full true
^\.chunk/.* full true
^mise\.toml$ full true
^mise\.lock$ full true
^\.pre-commit-config\.yaml$ full true
^Directory\..* full true
^NuGet\.Config$ full true
^LongshotLauncher\.slnx$ full true
^.*packages\.lock\.json$ full true
^global\.json$ full true
